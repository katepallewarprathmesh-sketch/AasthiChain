# Three-node Raft ordering service, one per availability zone.
orderer:
  organisation:
    name: OrdererOrg
    mspId: OrdererMSP
    namespace: orderer
  ca_secret: rca-secret
  tls_ca_secret: tlsca-secret
  nodes:
    - name: orderer1
      zone: ap-south-1a
    - name: orderer2
      zone: ap-south-1b
    - name: orderer3
      zone: ap-south-1c
  consensus:
    type: etcdraft
    tickInterval: 500ms
    electionTick: 10
    heartbeatTick: 1
  batch:
    # Property settlement is latency-sensitive at the point of sale, so the
    # timeout dominates: a lone settlement must not wait for a full batch.
    timeout: 500ms
    maxMessageCount: 500
    absoluteMaxBytes: 10 MB
    preferredMaxBytes: 2 MB
  persistence:
    size: 100Gi
    storageClass: standard
