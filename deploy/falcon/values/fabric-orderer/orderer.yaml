# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# Three-node Raft ordering service, one per availability zone.
nameOverride: "orderer"
project: aasthichain
orderers:
  - name: orderer0
    identity_name: orderer0-orderer
    identity_secret: ${ORDERER0_SECRET}
  - name: orderer1
    identity_name: orderer1-orderer
    identity_secret: ${ORDERER1_SECRET}
  - name: orderer2
    identity_name: orderer2-orderer
    identity_secret: ${ORDERER2_SECRET}
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
filestore_endpoint: http://filestore.aasthichain.net:30001
filestore_ssl: false
hlf_domain: aasthichain.net
retry_seconds: 60
init:
  image:
    repository: npcioss/hlf-builder
    tag: "2.5"
global:
  containerPort: 7050
  servicePort: 7050
  replicaCount: 1
  ica_endpoint: ica-orderer.aasthichain.net:30000
  tlsca_endpoint: tls-ca.aasthichain.net:30000
  block_file: genesis.block
  require_certs_dir_persistence: true
  image:
    repository: npcioss/drunix-orderer
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  ingressEnabled: true
  ingress:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
  storageAccessMode: ReadWriteOnce
  dataStorageSize: "100Gi"
  certStorageSize: "50M"
  storageClass: standard
  operations:
    serviceName: operations
    serviceType: ClusterIP
    servicePort: 8443
  metrics:
    provider: prometheus
    serviceMonitor:
      enabled: true
      portName: operations
      scrapeInterval: 30s
  env:
    - name: FABRIC_LOGGING_SPEC
      value: INFO
    - name: ORDERER_GENERAL_LISTENADDRESS
      value: 0.0.0.0
    - name: ORDERER_GENERAL_TLS_ENABLED
      value: "true"
    # A property settlement must not wait behind an empty batch: the timeout
    # dominates, and a lone trade cuts a block in half a second.
    - name: ORDERER_GENERAL_BATCHTIMEOUT
      value: "500ms"
    - name: ORDERER_GENERAL_BATCHSIZE_MAXMESSAGECOUNT
      value: "500"
    - name: ORDERER_GENERAL_BATCHSIZE_PREFERREDMAXBYTES
      value: "2 MB"
  nodeSelector: {}
  affinity:
    # One orderer per zone. Losing a zone must not lose the quorum.
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orderer
