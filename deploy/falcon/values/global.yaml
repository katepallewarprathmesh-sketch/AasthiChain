# Shared settings for every Falcon chart in this deployment.
# Override per environment: state rollout, DR region, or a partner bank's cluster.
global:
  project: aasthichain
  hlf_domain: aasthichain.net
  ingress:
    className: nginx
    httpsNodePort: 30000
    httpNodePort: 30001
    sslPassthrough: true
  storageClass: standard
  images:
    # DRUNIX runtime images (NPCI fork of Fabric 2.5.x). Falcon deploys these
    # in place of the upstream peer image; the chaincode is unchanged.
    peer: npcioss/drunix-peer:latest
    orderer: npcioss/drunix-orderer:latest
    validationService: npcioss/drunix-vscc:latest
    ca: hyperledger/fabric-ca:1.5.7
    builder: npcioss/falcon-builder:latest
  stateDatabase:
    type: yugabytedb
    # SQL state storage is the DRUNIX capability we depend on for supervisory
    # reporting: holders per asset, open conditional settlements, refusals in a
    # window, all as SQL rather than key-value scans.
    endpoint: yb-tservers.yugabyte.svc.cluster.local:5433
    database: aasthichain_state
  transientStore:
    type: keydb
    # Shared per organisation. Private data (consideration, valuation inputs,
    # KYC attributes) lives here between the Lite Peer and the Committing Peer
    # and never reaches the shared ledger.
    endpoint: keydb.{{ .Release.Namespace }}.svc.cluster.local:6379
  channel: property-channel
  chaincode:
    name: aasthichain
    version: "1.0"
    language: golang
