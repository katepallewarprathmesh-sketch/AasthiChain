# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# regulator Lite Peers: stateless endorsement and queries.
# Supervisory access. Reads the channel, endorses nothing that issues or moves value.
#
# Lite Peers hold no ledger. They execute chaincode, build the read-write set
# and write private data to the KeyDB transient store, then forward to this
# organisation's Committing Peer. They are the role to add when read and
# endorsement traffic grows, which for us means portals, dashboards and
# settlement instructions.
nameOverride: "regulator"
project: aasthichain
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
init:
  image:
    repository: npcioss/hlf-builder
    tag: "2.5"
ica_tls_certfile: /tmp/ca-cert.pem
tlsca_tls_certfile: /tmp/tlsca-cert.pem
fabric_base_dir: /etc/hyperledger/fabric
retry_seconds: 60
peers:
  - name: lp1-regulator
    identity_name: lp1-regulator
    identity_secret: ${LP1_REGULATOR_SECRET}
  - name: lp2-regulator
    identity_name: lp2-regulator
    identity_secret: ${LP2_REGULATOR_SECRET}
global:
  hlf_domain: aasthichain.net
  ica_endpoint: ica-regulator.aasthichain.net:30000
  tlsca_endpoint: tls-ca.aasthichain.net:30000
  storageClass: standard
  ingressEnabled: true
  ingressClass: nginx
  ingressPort: 30000
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
  imagePullPolicy: IfNotPresent
  # DRUNIX state lives in distributed SQL, so CouchDB is off.
  useCouchDB: false
  peerImageRegistry: docker.io
  peerImageRepo: npcioss/drunix-peer
  peerImageTag: "1.0.0"
  peerContainerPort: "7051"
  peerServicePort: "7051"
  peerDataDir: /var/hyperledger/production
  peerDiskSize: 5G
  peerCertDiskSize: 50M
  peerPvcAccessMode: ReadWriteOnce
  peerResources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }
  operations:
    serviceName: operations
    serviceType: ClusterIP
    servicePort: 9443
  metrics:
    provider: prometheus
    serviceMonitor:
      enabled: true
      portName: operations
      scrapeInterval: 30s
additionalEnvironmentVars:
  peer:
    - name: FABRIC_LOGGING_SPEC
      value: INFO
    - name: CORE_PEER_LOCALMSPID
      value: RegulatorMSP
    - name: CORE_PEER_TLS_ENABLED
      value: "true"
    # This is the Lite Peer half of the DRUNIX split.
    - name: CORE_PEER_LITEPEER_ENABLED
      value: "true"
    - name: CORE_PEER_COMMITTINGPEER_ID
      value: cp1-regulator.aasthichain.net
    - name: CORE_PEER_COMMITTINGPEER_ENDPOINT
      value: dns:///cp1-regulator.aasthichain.net:7061
    - name: CORE_PEER_COMMITTINGPEER_TLSCERTPATH
      value: /etc/hyperledger/fabric/cp/tls/ca.crt
    - name: CORE_PEER_COMMITTINGPEER_FORWARDCOMMITSTATUSREQUESTS_ENABLED
      value: "true"
    - name: CORE_PEER_GOSSIP_STATE_ENABLED
      value: "false"
    - name: CORE_PEER_DELIVERYCLIENT_BLOCKGOSSIPENABLED
      value: "false"
    # Transient store shared with this organisation's Committing Peer: private
    # data never crosses the organisation boundary.
    - name: CORE_PEER_KVSTORE_ENABLED
      value: "true"
    - name: CORE_PEER_KVSTORE_ADDRESS
      value: "hlf-keydb-regulator:6379"
    - name: CORE_PEER_KVSTORE_REPLICAADDRESS
      value: "hlf-keydb-regulator:6379"
    - name: CORE_PEER_KVSTORE_POOLFIFO
      value: "true"
    - name: CORE_PEER_KVSTORE_POOLSIZE
      value: "30"
    - name: CORE_PEER_KVSTORE_MINIDLECONNS
      value: "30"
    - name: CORE_PEER_KVSTORE_MAXACTIVECONNS
      value: "30"
    - name: CORE_PEER_KVSTORE_CONNMAXIDLETIME
      value: "10m"
    - name: CORE_PEER_KVSTORE_DB
      value: "0"
    - name: CORE_LEDGER_STATE_STATEDATABASE
      value: "sqldb"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_ADDRESS
      value: "yb-tservers.yugabyte.svc.cluster.local"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_PORT
      value: "5433"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_DBNAME
      value: "regulator_state"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_USER
      value: "regulator_peer"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_SSLMODE
      value: "verify-full"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_PREPARESTATEMENT
      value: "true"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_BATCHSIZE
      value: "100"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_MAXIDLECONNS
      value: "50"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_MAXOPENCONNS
      value: "50"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_CONNMAXLIFETIME
      value: "60m"
