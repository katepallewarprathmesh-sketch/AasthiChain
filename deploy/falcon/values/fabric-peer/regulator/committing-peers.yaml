# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# regulator Committing Peers: MVCC validation, commit, and ownership of state.
#
# The Committing Peer is the accountable role. It pulls blocks, delegates
# endorsement-policy and signature checking to the stateless Validation
# Service, performs MVCC validation (which is what stops the same fraction
# being sold twice), and applies the write set to the SQL state database.
nameOverride: "regulator-cp"
project: aasthichain
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
init:
  image:
    repository: npcioss/hlf-builder
    tag: "2.5"
ica_tls_certfile: /tmp/ca-cert.pem
tlsca_tls_certfile: /tmp/tlsca-cert.pem
fabric_base_dir: /etc/hyperledger/fabric
retry_seconds: 60
peers:
  - name: cp1-regulator
    identity_name: cp1-regulator
    identity_secret: ${CP1_REGULATOR_SECRET}
global:
  hlf_domain: aasthichain.net
  ica_endpoint: ica-regulator.aasthichain.net:30000
  tlsca_endpoint: tls-ca.aasthichain.net:30000
  storageClass: standard
  ingressEnabled: true
  ingressClass: nginx
  ingressPort: 30000
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
  useCouchDB: false
  peerImageRegistry: docker.io
  peerImageRepo: npcioss/drunix-peer
  peerImageTag: "1.0.0"
  peerContainerPort: "7061"
  peerServicePort: "7061"
  peerDataDir: /var/hyperledger/production
  peerDiskSize: 500G
  peerCertDiskSize: 50M
  peerPvcAccessMode: ReadWriteOnce
  peerResources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { cpu: "4", memory: 16Gi }
  operations:
    serviceName: operations
    serviceType: ClusterIP
    servicePort: 9443
  metrics:
    provider: prometheus
    serviceMonitor:
      enabled: true
      portName: operations
      scrapeInterval: 30s
additionalEnvironmentVars:
  peer:
    - name: FABRIC_LOGGING_SPEC
      value: INFO
    - name: CORE_PEER_LOCALMSPID
      value: RegulatorMSP
    - name: CORE_PEER_TLS_ENABLED
      value: "true"
    # Validation is delegated, not performed in-process. This is the seam that
    # lets compliance checking scale without touching commit throughput.
    - name: CORE_PEER_VSCCSERVICE_ENABLED
      value: "true"
    - name: CORE_PEER_VSCCSERVICE_TLS_ENABLED
      value: "true"
    - name: CORE_PEER_VSCCSERVICE_INGRESSENDPOINT
      value: cp1-regulator.aasthichain.net
    - name: CORE_PEER_VSCCSERVICE_ENDPOINT
      value: vs1-regulator.aasthichain.net:7071
    - name: CORE_PEER_VSCCSERVICE_BATCHSIZE
      value: "10"
    - name: CORE_PEER_GOSSIP_STATE_ENABLED
      value: "false"
    - name: CORE_PEER_DELIVERYCLIENT_BLOCKGOSSIPENABLED
      value: "false"
    - name: CORE_PEER_KVSTORE_ENABLED
      value: "true"
    - name: CORE_PEER_KVSTORE_ADDRESS
      value: "hlf-keydb-regulator:6379"
    - name: CORE_PEER_KVSTORE_REPLICAADDRESS
      value: "hlf-keydb-regulator:6379"
    - name: CORE_PEER_KVSTORE_POOLFIFO
      value: "true"
    - name: CORE_PEER_KVSTORE_POOLSIZE
      value: "30"
    - name: CORE_PEER_KVSTORE_MINIDLECONNS
      value: "30"
    - name: CORE_PEER_KVSTORE_MAXACTIVECONNS
      value: "30"
    - name: CORE_PEER_KVSTORE_CONNMAXIDLETIME
      value: "10m"
    - name: CORE_PEER_KVSTORE_DB
      value: "0"
    - name: CORE_LEDGER_STATE_STATEDATABASE
      value: "sqldb"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_ADDRESS
      value: "yb-tservers.yugabyte.svc.cluster.local"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_PORT
      value: "5433"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_DBNAME
      value: "regulator_state"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_USER
      value: "regulator_peer"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_SSLMODE
      value: "verify-full"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_PREPARESTATEMENT
      value: "true"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_BATCHSIZE
      value: "100"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_MAXIDLECONNS
      value: "50"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_MAXOPENCONNS
      value: "50"
    - name: CORE_LEDGER_STATE_SQLDBCONFIG_CONNMAXLIFETIME
      value: "60m"
