# InvestorOrg peers.
# Custodian for retail and institutional holders. Carries the heaviest read and endorsement load.
organisation:
  name: InvestorOrg
  mspId: InvestorMSP
  namespace: investor
  domain: investor.aasthichain.net

ca_secret: investor-ca-secret
tls_ca_secret: tlsca-secret

# DRUNIX splits the Fabric peer into three roles. Each scales on its own axis:
# Lite Peers with endorsement and query load, Validation Services with
# signature and policy checking throughput, Committing Peers with state size.
peers:
  lite:
    count: 4
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
    # Lite Peers hold no ledger, so they are cheap to add and cheap to lose.
    persistence:
      enabled: false
  committing:
    count: 2
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "4", memory: 16Gi }
    persistence:
      size: 500Gi
      storageClass: standard
  validation:
    count: 4
    stateless: true
    resources:
      requests: { cpu: "1", memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }
    autoscaling:
      enabled: true
      minReplicas: 4
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70

transientStore:
  keydb:
    enabled: true
    replicas: 2
    maxmemoryPolicy: noeviction

stateDatabase:
  yugabytedb:
    enabled: true
    schema: investor_state

anchorPeers:
  - host: lp1.investor.aasthichain.net
    port: 443
