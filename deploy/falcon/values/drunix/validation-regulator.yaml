# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# regulator Validation Services: stateless, horizontally scalable.
#
# Falcon's fabric-peer chart deploys peers; the Validation Service is a DRUNIX
# role with its own image and entrypoint ("vscc node start"), so it is deployed
# from charts/drunix-validation in this repository, using the same identities
# and the same KeyDB and SQL settings as the peers above.
nameOverride: "vs-regulator"
project: aasthichain
organisation:
  name: regulator
  mspId: RegulatorMSP
image:
  repository: npcioss/drunix-vscc
  tag: "1.0.0"
  pullPolicy: IfNotPresent
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
service:
  port: 7071
  operationsPort: 9464
identities:
  - identity_name: vs1-regulator
    identity_secret: ${VS1_REGULATOR_SECRET}
  - identity_name: vs2-regulator
    identity_secret: ${VS2_REGULATOR_SECRET}
resources:
  requests: { cpu: "1", memory: 1Gi }
  limits: { cpu: "2", memory: 2Gi }
env:
  - name: FABRIC_LOGGING_SPEC
    value: INFO
  - name: CORE_PEER_LOCALMSPID
    value: RegulatorMSP
  - name: CORE_PEER_TLS_ENABLED
    value: "true"
  - name: CORE_PEER_VSCCSERVER_CONFIGTXCHANNELNAME
    value: config-tx-channel
  - name: CORE_PEER_VSCCSERVER_CONFIGTXCHANNELTIMEOUT
    value: 6s
  # One goroutine per in-flight validation. Our transactions carry KYC, AML,
  # cap, mandate and credential checks, so validation is the CPU-heavy phase.
  - name: CORE_PEER_VALIDATORPOOLSIZE
    value: "128"
  - name: CORE_PEER_KVSTORE_ENABLED
    value: "true"
  - name: CORE_PEER_KVSTORE_ADDRESS
    value: "hlf-keydb-regulator:6379"
  - name: CORE_PEER_KVSTORE_REPLICAADDRESS
    value: "hlf-keydb-regulator:6379"
  - name: CORE_PEER_KVSTORE_POOLFIFO
    value: "true"
  - name: CORE_PEER_KVSTORE_POOLSIZE
    value: "30"
  - name: CORE_PEER_KVSTORE_MINIDLECONNS
    value: "30"
  - name: CORE_PEER_KVSTORE_MAXACTIVECONNS
    value: "30"
  - name: CORE_PEER_KVSTORE_CONNMAXIDLETIME
    value: "10m"
  - name: CORE_PEER_KVSTORE_DB
    value: "0"
  - name: CORE_LEDGER_STATE_STATEDATABASE
    value: "sqldb"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_ADDRESS
    value: "yb-tservers.yugabyte.svc.cluster.local"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_PORT
    value: "5433"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_DBNAME
    value: "regulator_state"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_USER
    value: "regulator_peer"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_SSLMODE
    value: "verify-full"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_PREPARESTATEMENT
    value: "true"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_BATCHSIZE
    value: "100"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_MAXIDLECONNS
    value: "50"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_MAXOPENCONNS
    value: "50"
  - name: CORE_LEDGER_STATE_SQLDBCONFIG_CONNMAXLIFETIME
    value: "60m"
