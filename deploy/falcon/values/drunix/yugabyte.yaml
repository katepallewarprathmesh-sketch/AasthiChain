# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# SQL state database. This is the DRUNIX capability the product depends on for
# supervisory reporting: holders per asset, open conditional settlements per
# buyer, refusals in a window, all as SQL rather than key-value scans.
image:
  repository: yugabytedb/yugabyte
  tag: "2025.2.0.0-b131"
replicas:
  master: 3
  tserver: 3
# One replica per zone, so the state database survives a zone loss with the
# same quorum story as the ordering service.
isMultiAz: true
masterAddresses: "yb-master-0:7100,yb-master-1:7100,yb-master-2:7100"
storage:
  master: { size: 50Gi, storageClass: standard }
  tserver: { size: 500Gi, storageClass: standard }
tls:
  enabled: true
  clientToServer: true
databases:
  - name: originator_state
    owner: originator_peer
  - name: registrar_state
    owner: registrar_peer
  - name: investor_state
    owner: investor_peer
  - name: regulator_state
    owner: regulator_peer
