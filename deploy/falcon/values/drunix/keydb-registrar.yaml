# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# registrar transient store. Private data (consideration, valuation inputs, KYC
# attributes) lives here between the Lite Peer and the Committing Peer of this
# organisation and never reaches the shared ledger: only its hash does.
nameOverride: "hlf-keydb-registrar"
fullnameOverride: "hlf-keydb-registrar"
image:
  repository: eqalpha/keydb
  tag: "latest"
replicaCount: 2
service:
  port: 6379
auth:
  existingSecret: registrar-keydb-secret
persistence:
  enabled: true
  size: 20Gi
  storageClass: standard
config:
  # Losing transient private data to an eviction would mean a commit that
  # cannot be completed, so eviction is refused rather than silently lossy.
  maxmemoryPolicy: noeviction
  appendonly: "yes"
