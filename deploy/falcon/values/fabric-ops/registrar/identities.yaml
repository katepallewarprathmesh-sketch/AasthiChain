# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# Title validation and credential issuance. Its signing identity is the evidence the rail releases money against.
nameOverride: "registrar"
project: aasthichain
fabric_actions:
  identity: true
image:
  repository: npcioss/hlf-builder
  tag: "2.5"
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
hlf_domain: aasthichain.net
ca_endpoint: ica-registrar.aasthichain.net:30000
ca_secret: registrar-ca-secret
tlsca_endpoint: tls-ca.aasthichain.net:30000
identities:
  - identity_name: admin
    identity_secret: ${REGISTRAR_ADMIN_SECRET}
    identity_type: admin
  - identity_name: lp1-registrar
    identity_secret: ${LP1_REGISTRAR_SECRET}
    identity_type: peer
  - identity_name: lp2-registrar
    identity_secret: ${LP2_REGISTRAR_SECRET}
    identity_type: peer
  - identity_name: cp1-registrar
    identity_secret: ${CP1_REGISTRAR_SECRET}
    identity_type: peer
  - identity_name: vs1-registrar
    identity_secret: ${VS1_REGISTRAR_SECRET}
    identity_type: peer
  - identity_name: vs2-registrar
    identity_secret: ${VS2_REGISTRAR_SECRET}
    identity_type: peer
  # The application identity the settlement gateway signs with. Its role
  # attribute is what the chaincode reads when deciding who may act.
  - identity_name: registrar-app
    identity_secret: ${REGISTRAR_APP_SECRET}
    identity_type: client
    attrs: "role=registrar:ecert,orgUnit=registrar:ecert"
tools:
  storageAccessMode: ReadWriteOnce
  storageSize: "5Gi"
  storageClass: standard
