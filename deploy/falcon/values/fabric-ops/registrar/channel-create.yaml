# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# The registrar creates the channel: it is the member with no trading position
# and a statutory role, which makes it the right consortium administrator.
nameOverride: "registrar"
project: aasthichain
image:
  repository: npcioss/hlf-builder
  tag: "2.5"
ica_endpoint: ica-registrar.aasthichain.net:30000
tlsca_endpoint: tls-ca.aasthichain.net:30000
orderer_endpoint: orderer0-orderer.aasthichain.net:30000
filestore_endpoint: http://filestore.aasthichain.net:30001
filestore_ssl: false
hlf_domain: aasthichain.net
fabric_actions:
  create_channel: true
app_channels:
  - property-channel
admin_organizations:
  - org_type: member
    org_name: originator
    ica_endpoint: ica-originator.aasthichain.net:30000
    cert_path: /root/originator.pem
    admin_identity: admin
    admin_secret: ${ORIGINATOR_ADMIN_SECRET}
    require_msp_enrollment: true
    require_tls_enrollment: false
    anchor_peers:
      - host: lp1-originator.aasthichain.net
        port: "30000"
  - org_type: consortium
    org_name: registrar
    ica_endpoint: ica-registrar.aasthichain.net:30000
    cert_path: /root/registrar.pem
    admin_identity: admin
    admin_secret: ${REGISTRAR_ADMIN_SECRET}
    require_msp_enrollment: true
    require_tls_enrollment: false
    anchor_peers:
      - host: lp1-registrar.aasthichain.net
        port: "30000"
  - org_type: member
    org_name: investor
    ica_endpoint: ica-investor.aasthichain.net:30000
    cert_path: /root/investor.pem
    admin_identity: admin
    admin_secret: ${INVESTOR_ADMIN_SECRET}
    require_msp_enrollment: true
    require_tls_enrollment: false
    anchor_peers:
      - host: lp1-investor.aasthichain.net
        port: "30000"
  - org_type: member
    org_name: regulator
    ica_endpoint: ica-regulator.aasthichain.net:30000
    cert_path: /root/regulator.pem
    admin_identity: admin
    admin_secret: ${REGULATOR_ADMIN_SECRET}
    require_msp_enrollment: true
    require_tls_enrollment: false
    anchor_peers:
      - host: lp1-regulator.aasthichain.net
        port: "30000"
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
configTxProfileType: ConsortiumProfile
consortiumName: AasthiChainConsortium
