# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# Custodian for retail and institutional holders. Carries the heaviest read and endorsement load.
nameOverride: "investor"
project: aasthichain
fabric_actions:
  identity: true
image:
  repository: npcioss/hlf-builder
  tag: "2.5"
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
hlf_domain: aasthichain.net
ca_endpoint: ica-investor.aasthichain.net:30000
ca_secret: investor-ca-secret
tlsca_endpoint: tls-ca.aasthichain.net:30000
identities:
  - identity_name: admin
    identity_secret: ${INVESTOR_ADMIN_SECRET}
    identity_type: admin
  - identity_name: lp1-investor
    identity_secret: ${LP1_INVESTOR_SECRET}
    identity_type: peer
  - identity_name: lp2-investor
    identity_secret: ${LP2_INVESTOR_SECRET}
    identity_type: peer
  - identity_name: lp3-investor
    identity_secret: ${LP3_INVESTOR_SECRET}
    identity_type: peer
  - identity_name: lp4-investor
    identity_secret: ${LP4_INVESTOR_SECRET}
    identity_type: peer
  - identity_name: cp1-investor
    identity_secret: ${CP1_INVESTOR_SECRET}
    identity_type: peer
  - identity_name: cp2-investor
    identity_secret: ${CP2_INVESTOR_SECRET}
    identity_type: peer
  - identity_name: vs1-investor
    identity_secret: ${VS1_INVESTOR_SECRET}
    identity_type: peer
  - identity_name: vs2-investor
    identity_secret: ${VS2_INVESTOR_SECRET}
    identity_type: peer
  - identity_name: vs3-investor
    identity_secret: ${VS3_INVESTOR_SECRET}
    identity_type: peer
  - identity_name: vs4-investor
    identity_secret: ${VS4_INVESTOR_SECRET}
    identity_type: peer
  # The application identity the settlement gateway signs with. Its role
  # attribute is what the chaincode reads when deciding who may act.
  - identity_name: investor-app
    identity_secret: ${INVESTOR_APP_SECRET}
    identity_type: client
    attrs: "role=investor:ecert,orgUnit=investor:ecert"
tools:
  storageAccessMode: ReadWriteOnce
  storageSize: "5Gi"
  storageClass: standard
