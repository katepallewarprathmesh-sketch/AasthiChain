# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# Property owners and developers: listing, and jointly with the registrar, issuance.
nameOverride: "originator"
project: aasthichain
fabric_actions:
  identity: true
image:
  repository: npcioss/hlf-builder
  tag: "2.5"
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
hlf_domain: aasthichain.net
ca_endpoint: ica-originator.aasthichain.net:30000
ca_secret: originator-ca-secret
tlsca_endpoint: tls-ca.aasthichain.net:30000
identities:
  - identity_name: admin
    identity_secret: ${ORIGINATOR_ADMIN_SECRET}
    identity_type: admin
  - identity_name: lp1-originator
    identity_secret: ${LP1_ORIGINATOR_SECRET}
    identity_type: peer
  - identity_name: lp2-originator
    identity_secret: ${LP2_ORIGINATOR_SECRET}
    identity_type: peer
  - identity_name: cp1-originator
    identity_secret: ${CP1_ORIGINATOR_SECRET}
    identity_type: peer
  - identity_name: vs1-originator
    identity_secret: ${VS1_ORIGINATOR_SECRET}
    identity_type: peer
  - identity_name: vs2-originator
    identity_secret: ${VS2_ORIGINATOR_SECRET}
    identity_type: peer
  # The application identity the settlement gateway signs with. Its role
  # attribute is what the chaincode reads when deciding who may act.
  - identity_name: originator-app
    identity_secret: ${ORIGINATOR_APP_SECRET}
    identity_type: client
    attrs: "role=originator:ecert,orgUnit=originator:ecert"
tools:
  storageAccessMode: ReadWriteOnce
  storageSize: "5Gi"
  storageClass: standard
