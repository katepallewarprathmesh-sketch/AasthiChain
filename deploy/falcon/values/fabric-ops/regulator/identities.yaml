# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# Supervisory access. Reads the channel, endorses nothing that issues or moves value.
nameOverride: "regulator"
project: aasthichain
fabric_actions:
  identity: true
image:
  repository: npcioss/hlf-builder
  tag: "2.5"
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
hlf_domain: aasthichain.net
ca_endpoint: ica-regulator.aasthichain.net:30000
ca_secret: regulator-ca-secret
tlsca_endpoint: tls-ca.aasthichain.net:30000
identities:
  - identity_name: admin
    identity_secret: ${REGULATOR_ADMIN_SECRET}
    identity_type: admin
  - identity_name: lp1-regulator
    identity_secret: ${LP1_REGULATOR_SECRET}
    identity_type: peer
  - identity_name: lp2-regulator
    identity_secret: ${LP2_REGULATOR_SECRET}
    identity_type: peer
  - identity_name: cp1-regulator
    identity_secret: ${CP1_REGULATOR_SECRET}
    identity_type: peer
  - identity_name: vs1-regulator
    identity_secret: ${VS1_REGULATOR_SECRET}
    identity_type: peer
  - identity_name: vs2-regulator
    identity_secret: ${VS2_REGULATOR_SECRET}
    identity_type: peer
  # The application identity the settlement gateway signs with. Its role
  # attribute is what the chaincode reads when deciding who may act.
  - identity_name: regulator-app
    identity_secret: ${REGULATOR_APP_SECRET}
    identity_type: client
    attrs: "role=regulator:ecert,orgUnit=regulator:ecert"
tools:
  storageAccessMode: ReadWriteOnce
  storageSize: "5Gi"
  storageClass: standard
