# Intermediate CA for orderer. Each organisation issues its own identities, so no
# single member can mint another member's certificates.
nameOverride: "ica-orderer"
project: aasthichain
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
hlf_domain: aasthichain.net
ca_server:
  name: ica-orderer
  admin_secret: orderer-ca-secret
  tls_domain: aasthichain.net
  parent_ca: root-ca.aasthichain.net:30000
  csr:
    cn: AasthiChain orderer Intermediate CA
    ou: orderer
global:
  hlf_domain: aasthichain.net
  storageClass: standard
  ingressEnabled: true
  ingressClass: nginx
  ingressPort: 30000
persistence:
  size: 10Gi
