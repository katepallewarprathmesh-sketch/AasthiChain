# Generated by deploy/falcon/generate.py. Edit that file, not this one.
# TLS CA: transport identity is kept separate from membership identity.
nameOverride: "tls-ca"
project: aasthichain
csr_names_cn: IN
csr_names_st: Maharashtra
csr_names_l: Pune
csr_names_o: AasthiChain
hlf_domain: aasthichain.net
ca_server:
  name: tls-ca
  admin_secret: tlsca-secret
  tls_domain: aasthichain.net
  csr:
    cn: AasthiChain TLS CA
    ou: tls
  signing:
    default:
      # Application identities are short-lived on purpose: a registrar that
      # leaves the consortium stops being able to sign within the year.
      expiry: 8760h
    profiles:
      ca:
        expiry: 43800h
global:
  hlf_domain: aasthichain.net
  storageClass: standard
  ingressEnabled: true
  ingressClass: nginx
  ingressPort: 30000
persistence:
  size: 10Gi
