# Keeps the Render instance awake.
#
# The rail runs on Render's free plan, which stops the container after
# fifteen consecutive minutes with no inbound request. The next visitor then
# waits roughly twenty-three seconds for a cold start, and because several
# screens fetch on mount, that wait shows up as a page that looks broken
# rather than a page that is loading. It is also the likeliest reason a
# payment started on a phone appears to hang: the first call of the session
# is the one that pays for the wake-up.
#
# A request every ten minutes keeps the fifteen-minute timer from ever
# expiring. Two honest caveats, both of which argue for the paid plan if
# this ever carries real users:
#
#   - GitHub's scheduled runners are best-effort and can be delayed by five
#     or ten minutes under load, so the occasional cold start will still
#     happen.
#   - Free Render includes 750 instance-hours a month and a month is about
#     730 hours, so keeping one service awake continuously uses nearly all
#     of the allowance. A second always-on free service would exceed it.
#
# The guaranteed fix is Render Starter at about $7 a month, which never
# sleeps. This workflow is the free approximation.

name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the rail
        run: |
          set -u
          URL="${{ vars.RAIL_HEALTH_URL || 'https://aasthichain.onrender.com/health' }}"
          # --max-time 60 because a cold start legitimately takes ~23s and a
          # loaded one can take longer. Three attempts, because the point is
          # to wake it, not to report on it.
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 60 "$URL" || echo 000)
            printf 'attempt %s: HTTP %s in response to %s\n' "$i" "$code" "$URL"
            if [ "$code" = "200" ]; then
              head -c 300 /tmp/body; echo
              exit 0
            fi
            sleep 20
          done
          echo "the rail did not answer 200 after three attempts"
          exit 1
