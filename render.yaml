# Render blueprint — hosts the Go Drunix gateway + UMI settlement rail so the
# deployed frontend (Vercel) has a live /api/umi/* backend.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo.
# Then set UMI_GATEWAY_URL on Vercel to the service URL Render gives you
# (the live one is https://aasthichain.onrender.com) and redeploy the frontend.
#
# Free tier note: the instance sleeps after inactivity, so the first request
# after a sleep is slow. Set DATABASE_URL (below) or the ledger is in-memory and
# a sleep erases committed blocks.
#
# Check what is actually deployed:  curl -s <service-url>/health | jq .build

services:
  - type: web
    name: aasthichain-umi-gateway
    runtime: docker
    repo: https://github.com/katepallewarprathmesh-sketch/AasthiChain
    branch: main
    dockerfilePath: ./drunix-gateway/Dockerfile
    dockerContext: ./drunix-gateway
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: UMI_ENABLED
        value: "true"
      - key: UMI_SEED_DEMO
        value: "true"
      - key: DRUNIX_MODE
        value: mock
      # Durable, append-only block storage. Without this the ledger lives in
      # memory and a free-instance sleep erases committed blocks, which the
      # append-only guarantee does not survive. Set it to the Neon/Postgres
      # connection string in the Render dashboard (sync:false = not in git).
      - key: DATABASE_URL
        sync: false
