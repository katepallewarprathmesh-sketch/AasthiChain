<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AasthiChain — Fractional Real Estate on Drunix</title>
  <meta name="description" content="Own a fraction of premium real estate from ₹500. Simulated UPI payments, instant tokenised ownership, and a transparent ledger — an interactive demo." />
  <meta name="theme-color" content="#0A0D13" />

  <!-- Speed up the font handshake, but never block first paint on it -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Inter:wght@400;500;600;700&display=swap">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Inter:wght@400;500;600;700&display=swap">
  </noscript>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{font-size:16px}
    body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0A0D13;color:#1A1F2B;-webkit-font-smoothing:antialiased}

    /* First-paint shell: shown from the very first byte, replaced when React mounts.
       Keeps the page from looking "stuck on white" while the bundle downloads. */
    #boot{min-height:100vh;display:flex;flex-direction:column;background:#0A0D13;color:#F7F5F0}
    #boot .boot-nav{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid rgba(247,245,240,.08)}
    #boot .boot-mark{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:18px;letter-spacing:-.02em}
    #boot .boot-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:64px 24px;max-width:1120px;margin:0 auto;width:100%}
    #boot .boot-pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9FB3C8;border:1px solid rgba(247,245,240,.14);border-radius:999px;padding:6px 12px}
    #boot h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(34px,6vw,62px);line-height:1.04;letter-spacing:-.025em;max-width:16ch}
    #boot p{font-size:clamp(15px,2vw,18px);line-height:1.55;color:#AFBCCB;max-width:58ch}
    #boot .boot-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
    #boot .boot-btn{height:46px;min-width:190px;border-radius:10px;background:#1E3A5F;opacity:.55}
    #boot .boot-btn.ghost{background:transparent;border:1px solid rgba(247,245,240,.16)}
    #boot .boot-bar{height:1px;background:linear-gradient(90deg,rgba(94,157,214,.9),rgba(94,157,214,0));animation:bootbar 1.1s ease-in-out infinite}
    @keyframes bootbar{0%{opacity:.25;transform:scaleX(.2);transform-origin:left}50%{opacity:.9;transform:scaleX(1);transform-origin:left}100%{opacity:.25;transform:scaleX(.2);transform-origin:left}}
    @media (prefers-reduced-motion: reduce){#boot .boot-bar{animation:none}}
  </style>

  <script>
    // Match the shell to the saved theme so there is no flash when React takes over.
    try {
      var m = localStorage.getItem('aasthi_theme') || 'dark';
      if (m === 'light') {
        document.documentElement.setAttribute('data-landing-theme', 'light');
        document.addEventListener('DOMContentLoaded', function () {
          document.body.style.background = '#F7F5F0';
          var b = document.getElementById('boot');
          if (b) { b.style.background = '#F7F5F0'; b.style.color = '#1A1F2B'; }
        });
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root">
    <div id="boot">
      <div class="boot-nav"><span class="boot-mark">AasthiChain</span></div>
      <div class="boot-main">
        <span class="boot-pill">Demo environment · simulated payments</span>
        <h1>Own premium real estate from ₹500</h1>
        <p>Buy fractions of verified properties, pay through a simulated UPI flow, and watch ownership settle on a transparent ledger.</p>
        <div class="boot-row"><div class="boot-btn"></div><div class="boot-btn ghost"></div></div>
        <div class="boot-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
