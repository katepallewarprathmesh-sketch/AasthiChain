# Fly.io alternative to render.yaml for the Go Drunix gateway + UMI rail.
#
#   cd drunix-gateway
#   fly launch --no-deploy --copy-config --name aasthichain-umi-gateway
#   fly deploy
#   fly status            # → https://aasthichain-umi-gateway.fly.dev
#
# Then set UMI_GATEWAY_URL on Vercel to that URL.

app = "aasthichain-umi-gateway"
primary_region = "bom"   # Mumbai

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "21100"
  UMI_ENABLED = "true"
  UMI_SEED_DEMO = "true"
  DRUNIX_MODE = "mock"

[http_service]
  internal_port = 21100
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
