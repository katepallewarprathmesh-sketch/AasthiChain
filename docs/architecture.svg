<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img"
     aria-label="AasthiChain architecture: owners, registrars, investors and regulators act through a React web app; a JavaScript edge owns the property register, KYC and the UPI money leg and forwards every settlement call to a Go rail; the rail authenticates the caller, checks authorisation in front of its router, moves the e-rupee-W cash leg and the Drunix securities leg atomically, and appends every state change to a hash-chained, Postgres-durable ledger.">
  <!-- Styling is set per element rather than in a <style> block: some renderers
       and sanitisers drop embedded CSS, and a diagram that loses its type is
       worse than no diagram. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA3AF"/>
    </marker>
    <marker id="aGo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00ADD8"/>
    </marker>
  </defs>

  <rect width="1200" height="880" fill="#F7F5F0"/>

  <!-- people -->
  <text x="60" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#8A8375">PEOPLE</text>
  <rect x="60"  y="66" width="252" height="58" rx="10" fill="#FFFFFF" stroke="#DED8CC"/>
  <text x="80"  y="92"  font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Owner</text>
  <text x="80"  y="110" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">lists a property, mints tokens</text>

  <rect x="336" y="66" width="252" height="58" rx="10" fill="#FFFFFF" stroke="#DED8CC"/>
  <text x="356" y="92"  font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Registrar</text>
  <text x="356" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">validates title — never the owner</text>

  <rect x="612" y="66" width="252" height="58" rx="10" fill="#FFFFFF" stroke="#DED8CC"/>
  <text x="632" y="92"  font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Investor</text>
  <text x="632" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">buys from ₹500, earns rent</text>

  <rect x="888" y="66" width="252" height="58" rx="10" fill="#FFFFFF" stroke="#DED8CC"/>
  <text x="908" y="92"  font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Regulator</text>
  <text x="908" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">freezes, audits, repairs</text>

  <line x1="600" y1="124" x2="600" y2="162" stroke="#9AA3AF" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- browser -->
  <text x="60" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#8A8375">BROWSER</text>
  <rect x="60" y="204" width="1080" height="80" rx="12" fill="#FFFFFF" stroke="#DED8CC"/>
  <text x="84" y="232" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">React + Vite single-page app</text>
  <text x="84" y="252" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">marketplace · verification panel · ledger explorer · baskets · investor dashboard · calculators</text>
  <text x="84" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">Clerk sign-in · public pages stay open to visitors and crawlers</text>

  <line x1="600" y1="284" x2="600" y2="322" stroke="#9AA3AF" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="612" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D8694">HTTPS · /api/*</text>

  <!-- edge -->
  <text x="60" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#8A8375">EDGE — JAVASCRIPT, VERCEL</text>
  <rect x="60" y="364" width="1080" height="132" rx="12" fill="#FFFFFF" stroke="#DED8CC"/>

  <rect x="84" y="388" width="1032" height="42" rx="9" fill="#F3EEFA" stroke="#DCD0EE"/>
  <text x="104" y="406" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Authentication — who is actually calling</text>
  <text x="104" y="423" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">Clerk session verified against published keys · an identity header is a claim, never proof · no session means anonymous</text>

  <rect x="84" y="440" width="500" height="44" rx="9" fill="#FAF8F4" stroke="#E6E0D4"/>
  <text x="104" y="458" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">Owns outright</text>
  <text x="104" y="475" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">property register · KYC · UPI Collect + PayU · fraud screen · swaps</text>

  <rect x="616" y="440" width="500" height="44" rx="9" fill="#FAF8F4" stroke="#E6E0D4"/>
  <text x="636" y="458" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">Forwards only — /api/umi/*, /api/drunix/*</text>
  <text x="636" y="475" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">zero settlement logic · unreachable rail reports unknown, never healthy</text>

  <line x1="600" y1="496" x2="600" y2="536" stroke="#00ADD8" stroke-width="2" marker-end="url(#aGo)"/>
  <text x="612" y="520" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D8694">caller identity forwarded</text>

  <!-- rail -->
  <text x="60" y="564" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#8A8375">SETTLEMENT RAIL — GO, RENDER</text>
  <rect x="60" y="578" width="1080" height="208" rx="12" fill="#FFFFFF" stroke="#00ADD8" stroke-width="1.6"/>

  <rect x="84" y="600" width="1032" height="50" rx="9" fill="#EAF7FB" stroke="#B9E3F0"/>
  <text x="104" y="622" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Authorisation — in front of the router, not route by route</text>
  <text x="104" y="640" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">anonymous 401 · not yours 403 · supervisors are regulator and admin · attribution comes from the caller, never the body</text>

  <rect x="84" y="664" width="330" height="100" rx="9" fill="#FAF8F4" stroke="#E6E0D4"/>
  <text x="104" y="688" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Cash leg — e₹-W wallets</text>
  <text x="104" y="708" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">wholesale CBDC, simulated</text>
  <text x="104" y="726" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">money is conserved: balances always</text>
  <text x="104" y="744" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">reconcile against lifetime funding</text>

  <rect x="435" y="664" width="330" height="100" rx="9" fill="#FAF8F4" stroke="#E6E0D4"/>
  <text x="455" y="688" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Securities leg — Drunix</text>
  <text x="455" y="708" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">positions, cap table, ISIN register</text>
  <text x="455" y="726" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">baskets, servicing and income</text>
  <text x="455" y="744" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">supply can never exceed authorised</text>

  <rect x="786" y="664" width="330" height="100" rx="9" fill="#FFF7E8" stroke="#F0DFBE"/>
  <text x="806" y="688" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Atomic DvP</text>
  <text x="806" y="708" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">both legs move, or neither does</text>
  <text x="806" y="726" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">a retry returns the first outcome;</text>
  <text x="806" y="744" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C6B7F">a failure stays a failure</text>

  <line x1="600" y1="786" x2="600" y2="820" stroke="#00ADD8" stroke-width="2" marker-end="url(#aGo)"/>
  <text x="612" y="808" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7D8694">block appended before state changes</text>

  <!-- ledger -->
  <rect x="60" y="820" width="1080" height="46" rx="10" fill="#1E3A5F"/>
  <text x="84"  y="842" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1" fill="#8FD4EA">LEDGER</text>
  <text x="156" y="842" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF">Hash-chained, append-only · Postgres-durable · survives restart</text>
  <text x="156" y="859" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#B9C6D6">tamper seals the rail · repair is supervisor-only and records every block it discarded</text>
</svg>
